[project]
name = "path-component-case-conflict-checker"
version = "0.1.0"
description = "Detects case-insensitive path collisions that would break when transferring between case-insensitive and case-sensitive filesystems."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
